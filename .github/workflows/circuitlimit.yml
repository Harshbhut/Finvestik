name: "Circuit Limit Script"

on:
  schedule:
    - cron: "30 2 * * 1-6"
  workflow_dispatch:

# Only this collector job can write generated snapshots.
permissions:
  contents: read
concurrency:
  group: data-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  collect:
    if: ${{ github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      DATA_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      - name: Checkout default branch
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install collector dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Collect and validate data
        run: python scripts/circuitlimit.py
      - name: Commit generated snapshots
        run: bash scripts/commit_data.sh scripts/circuit_limits.json
